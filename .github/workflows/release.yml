name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  # shortcut: actionlint 1.7.12はqueue未対応。対応版になったら検証時のignoreを外す。
  queue: max

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev subversion
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:release
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  prepare:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      release_id: ${{ steps.release.outputs.id }}
      skip: ${{ steps.version.outputs.skip == 'true' || steps.release.outputs.published == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare version and immutable source tag
        id: version
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/release.mjs prepare
      - name: Push release tag
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"
      - name: Create or resume draft release
        if: steps.version.outputs.skip != 'true'
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            // タグ検索APIは下書きを返さないため、下書きも含む一覧から探す。
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(release => release.tag_name === tag);
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: process.env.RELEASE_COMMIT,
                name: `Simple VCS ${tag}`, draft: true, prerelease: false, generate_release_notes: true,
                body: 'Windows x64・macOS Apple Silicon/Intel・Linux x64向け。ローカル操作用のSVN CLI、SSH操作用のOpenSSHは別途必要です。macOSはad-hoc署名、Apple公証・Windowsの証明書署名は未設定です。'
              })).data;
            }
            core.setOutput('id', release.id);
            core.setOutput('published', !release.draft);

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run version:check
      - name: Build installers and upload workflow artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: release-[platform]-[arch]-[bundle]
          uploadUpdaterJson: false

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check release is still a draft and tag is unchanged
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release = (await github.rest.repos.getRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID) })).data;
            const commit = (await github.rest.repos.getCommit({ owner, repo, ref: process.env.RELEASE_TAG })).data;
            if (!release.draft || release.tag_name !== process.env.RELEASE_TAG || commit.sha !== process.env.RELEASE_COMMIT) {
              throw new Error('Releaseの公開状態またはタグが変更されています。上書きせず停止します。');
            }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify installer set and generate checksums
        shell: bash
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          for extension in exe msi deb AppImage; do
            files=(*."$extension")
            if (( ${#files[@]} == 0 )); then
              echo "Missing release installer: $extension" >&2
              exit 1
            fi
          done
          mac_installers=(*.dmg)
          if (( ${#mac_installers[@]} != 2 )); then
            echo 'Both macOS installers are required' >&2
            exit 1
          fi
          files=(*.exe *.msi *.deb *.AppImage *.dmg)
          sha256sum -- "${files[@]}" > SHA256SUMS
      - name: Upload complete asset set
        shell: bash
        working-directory: release-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(*.exe *.msi *.deb *.AppImage *.dmg)
          gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS --clobber
      - name: Publish release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const { shouldMakeLatest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const versions = releases.filter(release => !release.draft && !release.prerelease && /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(release.tag_name)).map(release => release.tag_name.slice(1));
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false,
              make_latest: shouldMakeLatest(process.env.RELEASE_TAG.slice(1), versions) ? 'true' : 'false'
            });
