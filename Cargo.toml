[workspace]
members = ["crates/vcs-core", "src-tauri"]
default-members = ["crates/vcs-core"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
